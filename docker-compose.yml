services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxa
      POSTGRES_USER: ${POSTGRES_USER:-pg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$$POSTGRES_USER' -d '$$POSTGRES_DB'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/figwood/fluxa-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      APP_ENV: production
      HTTP_ADDR: :8090
      DB_DRIVER: postgres
      POSTGRES_DSN: host=db port=5432 user=${POSTGRES_USER:-pg} password=${POSTGRES_PASSWORD} dbname=fluxa sslmode=disable
      AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/figwood/fluxa-worker:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_DRIVER: postgres
      POSTGRES_DSN: host=db port=5432 user=${POSTGRES_USER:-pg} password=${POSTGRES_PASSWORD} dbname=fluxa sslmode=disable
      AUTO_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/figwood/fluxa-web:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      NODE_ENV: production
      BACKEND_BASE_URL: http://api:8090
      PORT: 3090
    ports:
      - "3090:3090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
